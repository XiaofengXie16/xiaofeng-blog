# fly.toml app configuration file generated for xiaofeng-blog on 2023-12-17T01:52:14-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "xiaofeng-blog"
primary_region = "ewr"

[build]
dockerfile = "Dockerfile"

[build.args]
# Baked into canonical/og/sitemap/RSS URLs at build time. The app is served on
# this custom domain; keep it in step with README.md and src/constants/site.ts.
VITE_SITE_URL = "https://www.xiaofengxie.dev"

[http_service]
internal_port = 3000
force_https = true
auto_stop_machines = true
auto_start_machines = true
min_machines_running = 1
processes = ["app"]

[[vm]]
cpu_kind = "shared"
cpus = 1
memory_mb = 512
