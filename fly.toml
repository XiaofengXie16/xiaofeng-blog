# fly.toml app configuration file generated for xiaofeng-blog on 2023-12-17T01:52:14-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "xiaofeng-blog"
primary_region = "ewr"

[build]
dockerfile = "Dockerfile"

[http_service]
internal_port = 3000
force_https = true
auto_stop_machines = true
auto_start_machines = true
min_machines_running = 1
processes = ["app"]

# Application-level liveness probe. Without a service check Fly only knows the
# process is listening on internal_port, so a release that boots but serves
# errors is still reported as a successful deploy. `flyctl deploy` smoke-tests
# this check before completing and fails the deploy when it does not pass.
[[http_service.checks]]
interval = "15s"
timeout = "2s"
grace_period = "10s"
method = "GET"
path = "/robots.txt"

[[vm]]
cpu_kind = "shared"
cpus = 1
memory_mb = 512
