name: Fly Deploy
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Lint, typecheck, tests (with coverage) and build run in the Dagger
      # module under .dagger/. Run the same pipeline locally with:
      #   dagger call check
      - name: Lint, typecheck, test and build (Dagger)
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.21.11"
          call: check

  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@1.6

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
